x-phpmyadmin-common: &pma-common
  image: phpmyadmin:5
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
  environment:
    PMA_HOST: mysql
    PMA_PORT: 3306
    UPLOAD_LIMIT: 64M

services:
  # ---------- Selalu jalan, hanya bisa diakses dari mesin ini ----------
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST:-localhost}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Profil DEV: hanya localhost, root diizinkan ----------
  phpmyadmin-dev:
    <<: *pma-common
    profiles: ["dev"]
    container_name: phpmyadmin-dev
    ports:
      - "127.0.0.1:8080:80"

  # ---------- Profil PROD: terbuka ke jaringan, root ditolak ----------
  phpmyadmin-prod:
    <<: *pma-common
    profiles: ["prod"]
    container_name: phpmyadmin-prod
    ports:
      - "${PMA_BIND:-0.0.0.0}:8080:80"
    volumes:
      - ./phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro

volumes:
  mysql_data:
  postgres_data:
